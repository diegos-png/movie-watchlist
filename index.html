<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Watchlist</title>
    <script src="js/script.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>My Movie Watchlist</h1>
    <form action="">
        <label for="movieInput">Movie title</label>
        <input type="text" name="movieInput" id="movieInput">
        <br>
        <label for="genreSelect">Genre</label>
        <select name="genreSelect" id="genreSelect">
            <option value="">Choose a genre</option>
        </select>
        
        <button type="submit" id="submitButton">Add Movie</button>
    </form>


    <p id="formMsg">Movies on my watchlist</p>
    <ul id="movieListUl">

    </ul>
    <p id="emptyListMsg"></p>
</body>

</html>
